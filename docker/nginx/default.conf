# Single entrypoint reverse proxy (host port 8080).
# Routes: / -> web, /admin/ -> admin, /api/ -> api.
# inventory and payment are intentionally NOT routed: frontends only talk to the API.
server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /api {
    return 301 /api/;
  }

  location /api/ {
    proxy_pass http://api:3001;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    proxy_pass http://admin:80;
  }

  location / {
    proxy_pass http://web:3000;
  }
}
