# Serves the Angular admin SPA under /admin/ (baseHref) plus the health contract.
server {
  listen 80;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"admin"}';
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /admin/index.html;
  }
}
