spring.application.name=payment
server.port=8082

spring.datasource.url=${PAYMENT_DATABASE_URL}

# Schema is owned by Flyway migrations; Hibernate must never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate

# Simulated payment gateway success rate (0.0-1.0). See SimulatedPaymentGateway.
payment.gateway.success-rate=${PAYMENT_GATEWAY_SUCCESS_RATE:0.9}

# Shared secret every internal route (except GET /health and the QStash webhook) requires via the
# X-Internal-Api-Key header. See InternalApiKeyFilter.
payment.internal-api-key=${INTERNAL_API_KEY}

# Upstash QStash signing keys, used to verify the Upstash-Signature header on inbound webhooks.
# Both are accepted (current tried first) because QStash rotates keys and accepts signatures made
# with either key during the rotation window. See QStashSignatureVerifier.
qstash.current-signing-key=${QSTASH_CURRENT_SIGNING_KEY}
qstash.next-signing-key=${QSTASH_NEXT_SIGNING_KEY}

# Full external URL QStash delivers the order.created webhook to; must match exactly what QStash
# signed. See QStashWebhookController.
payment.qstash.destination-url=${PAYMENT_QSTASH_DESTINATION_URL}
