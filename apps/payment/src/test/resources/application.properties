# Test-only overrides for @SpringBootTest context loading.
#
# The application's datasource URL is required and has no default (see
# src/main/resources/application.properties), so a full ApplicationContext boot without a real
# Postgres instance fails on DataSource/Flyway/Hibernate bean creation. This phase's own use-case
# unit tests do not need a Spring context at all (plain JUnit + hand-written fakes), but the
# pre-existing PaymentApplicationTests.contextLoads() test does load the full context.
#
# Excluding these three autoconfigurations here is the minimum needed to keep that smoke test
# running without a live database. A dedicated integration-test database/profile (Testcontainers or
# equivalent) is explicitly a later task's job ("Test suite proving every acceptance criterion").
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# Test-only stand-ins for the secrets/URLs InternalApiKeyFilter and QStashSignatureVerifier require
# to be constructed (see PaymentBeanConfiguration). Real values are only needed at runtime; these
# placeholders just let the ApplicationContext boot for contextLoads().
payment.internal-api-key=test-internal-api-key
qstash.current-signing-key=test-current-signing-key
qstash.next-signing-key=test-next-signing-key
payment.qstash.destination-url=http://localhost:8082/internal/v1/events/qstash
