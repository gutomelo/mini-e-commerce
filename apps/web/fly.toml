# Fly.io app configuration for apps/web (Next.js storefront).
#
# Deploy from the REPO ROOT (not this directory), so the build context
# matches the same context docker-compose.yml already uses:
#
#   flyctl deploy --config apps/web/fly.toml --dockerfile apps/web/Dockerfile .
#
# See docs/deployment/fly-io.md for the full app-creation/secrets sequence.

app = "mini-ecommerce-web"
primary_region = "gru"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
