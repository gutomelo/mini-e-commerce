packages:
  - 'apps/*'
  - 'packages/*'

# typescript-eslint does not support TypeScript >= 6 yet; keep the whole
# workspace on the 5.x line until the tooling catches up.
overrides:
  typescript: ^5.9.3

# Install-time build scripts pnpm should skip; these packages ship prebuilt
# binaries via optional platform-specific packages (sharp/unrs-resolver from
# the apps/web scaffold; the rest from the apps/admin Angular toolchain).
allowBuilds:
  '@parcel/watcher': false
  # Downloads the schema engine binary used by `prisma migrate` (apps/api).
  '@prisma/engines': true
  # node-gyp-build install hook; resolves the prebuilt binary shipped in the
  # tarball (glibc and musl), no compilation needed (apps/api).
  bcrypt: true
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  # Preinstall Node.js version check for the Prisma CLI (apps/api).
  prisma: true
  sharp: false
  unrs-resolver: false
