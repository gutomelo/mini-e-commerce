packages:
  - 'apps/*'
  - 'packages/*'

# typescript-eslint does not support TypeScript >= 6 yet; keep the whole
# workspace on the 5.x line until the tooling catches up.
overrides:
  typescript: ^5.9.3

# Install-time build scripts pnpm should skip; these packages ship prebuilt
# binaries via optional platform-specific packages (sharp/unrs-resolver from
# the apps/web scaffold; the rest from the apps/admin Angular toolchain).
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
